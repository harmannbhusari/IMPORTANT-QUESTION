<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Love Card 💕</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PAGE 1
    ========================== -->

    <section id="page1" class="page active">

        <!-- Floating hearts -->
        <div class="floating-hearts">
            <span>💗</span>
            <span>💕</span>
            <span>💖</span>
            <span>💞</span>
            <span>❤️</span>
            <span>💗</span>
        </div>


        <div class="intro-card">

            <!-- Two cute pookies -->
            <div class="pookies">

                <div class="pookie pookie-left">

                    <div class="ear left-ear"></div>
                    <div class="ear right-ear"></div>

                    <div class="face">
                        <div class="eye left-eye"></div>
                        <div class="eye right-eye"></div>

                        <div class="blush left-blush"></div>
                        <div class="blush right-blush"></div>

                        <div class="nose"></div>
                        <div class="mouth"></div>
                    </div>

                    <div class="body">
                        <span>💗</span>
                    </div>

                </div>


                <!-- Heart between them -->

                <div class="between-heart">
                    ❤️
                </div>


                <div class="pookie pookie-right">

                    <div class="ear left-ear"></div>
                    <div class="ear right-ear"></div>

                    <div class="face">
                        <div class="eye left-eye"></div>
                        <div class="eye right-eye"></div>

                        <div class="blush left-blush"></div>
                        <div class="blush right-blush"></div>

                        <div class="nose"></div>
                        <div class="mouth"></div>
                    </div>

                    <div class="body">
                        <span>💗</span>
                    </div>

                </div>

            </div>


            <h1>Hey You! 💕</h1>

            <p class="intro-text">
                I have something important to ask...
            </p>

            <p class="tap-text">
                ✨ Tap anywhere to continue ✨
            </p>

        </div>

    </section>



    <!-- =========================
         PAGE 2
    ========================== -->

    <section id="page2" class="page">

        <!-- Floating hearts -->
        <div class="floating-hearts">
            <span>💗</span>
            <span>💖</span>
            <span>💕</span>
            <span>💞</span>
            <span>❤️</span>
            <span>💗</span>
        </div>


        <div class="question-card">

            <div class="big-heart">
                💗
            </div>


            <h1>
                Do you love me? 💕
            </h1>


            <p class="question-text">
                Be honest... 🥺
            </p>


            <div class="buttons">

                <!-- YES -->
                <button id="yesBtn">
                    Yes 💖
                </button>


                <!-- NO -->
                <button id="noBtn">
                    No 😥
                </button>
                <p id="thinkMessage">
                    Think once again... 💭💕
                </p>

            </div>


            <p id="answer"></p>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
